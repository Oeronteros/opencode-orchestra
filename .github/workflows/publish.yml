name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          const tag = process.env.RELEASE_TAG;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? '')) {
            throw new Error(`Expected a stable release tag vX.Y.Z, got ${tag}`);
          }
          NODE
          # Update both manifests in the runner checkout without creating a commit or tag.
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      # prepublishOnly runs checks; prepack builds the package.
      # Configure npm Trusted Publisher for Oeronteros/opencode-orchestra,
      # workflow publish.yml, with direct npm publish allowed.
      - name: Publish package
        run: npm publish --access public
