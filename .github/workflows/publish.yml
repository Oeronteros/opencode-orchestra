name: Publish to npm

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to retry (vX.Y.Z); empty creates an automatic release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'release' || (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test release version selection
        run: node --test scripts/prepare-npm-release.test.mjs
      - name: Reserve release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: node scripts/prepare-npm-release.mjs

  voice:
    needs: prepare
    uses: ./.github/workflows/voice-overlay.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, voice]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # OIDC publishing must not inherit a placeholder NODE_AUTH_TOKEN.
          cache: npm

      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          const tag = process.env.RELEASE_TAG;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? '')) {
            throw new Error(`Expected a stable release tag vX.Y.Z, got ${tag}`);
          }
          NODE
          # Update both manifests in the runner checkout without creating a commit or tag.
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version --ignore-scripts
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          for (const file of ['package.json', 'package-lock.json']) {
            const manifest = JSON.parse(readFileSync(file, 'utf8'));
            const root = file === 'package.json' ? manifest : manifest.packages[''];
            root.optionalDependencies ??= {};
            for (const platform of ['linux-x64', 'win32-x64']) root.optionalDependencies[`@oeronteros-1/voice-overlay-${platform}`] = version;
            writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          }
          NODE

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install build dependencies
        # Sidecar binaries are optional runtime downloads, not build dependencies.
        # Unpublished sidecars have no lock entries and cause npm ci to reject the lock.
        # Restore the exact manifests before checks and publication.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execSync } from 'node:child_process';
          const files = ['package.json', 'package-lock.json'];
          const originals = files.map(file => readFileSync(file, 'utf8'));
          try {
            files.forEach((file, index) => {
              const manifest = JSON.parse(originals[index]);
              const root = index === 0 ? manifest : manifest.packages[''];
              for (const name of Object.keys(root.optionalDependencies ?? {})) {
                if (name.startsWith('@oeronteros-1/voice-overlay-')) delete root.optionalDependencies[name];
              }
              writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
            });
            execSync('npm ci', { stdio: 'inherit' });
          } finally {
            files.forEach((file, index) => writeFileSync(file, originals[index]));
          }
          NODE

      # prepublishOnly runs checks; prepack builds the package.
      # Configure npm Trusted Publisher for Oeronteros/opencode-orchestra,
      # workflow publish.yml, with direct npm publish allowed.
      - name: Publish package
        run: node scripts/publish-voice-package.mjs .
