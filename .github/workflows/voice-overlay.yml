name: voice-overlay

on:
  push:
    tags:
      - "voice-overlay-v*"
  workflow_dispatch:

# Trusted publishing to npm via OIDC: no NPM_TOKEN secret needed.
# The npm packages list this repo + workflow as trusted publisher.
permissions:
  contents: read
  id-token: write

env:
  FFMPEG_LINUX_URL: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
  FFMPEG_WINDOWS_URL: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
  WHISPER_LINUX_URL: https://github.com/ggml-org/whisper.cpp/releases/download/b4938/whisper-bin-ubuntu-x64.tar.gz
  WHISPER_WINDOWS_URL: https://github.com/ggml-org/whisper.cpp/releases/download/b4938/whisper-bin-x64.zip

jobs:
  build:
    # linux-arm64 follows (spec Section 7): add an `ubuntu-*-arm` runner row here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webkit deps
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci --prefix voice-overlay

      - name: Test sidecar packaging
        run: node --test scripts/pack-voice-overlay.test.mjs

      - name: Vendor ffmpeg + whisper sidecars (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          curl -sSL --fail --retry 3 --retry-all-errors "$FFMPEG_LINUX_URL" -o /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-*-amd64-static/ffmpeg "voice-overlay/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu"
          curl -sSL --fail --retry 3 --retry-all-errors "$WHISPER_LINUX_URL" -o /tmp/whisper.tgz
          mkdir -p /tmp/whisper && tar -xzf /tmp/whisper.tgz -C /tmp/whisper
          cp /tmp/whisper/whisper-bin-ubuntu-x64/whisper-cli "voice-overlay/src-tauri/binaries/whisper-x86_64-unknown-linux-gnu"
          cp /tmp/whisper/whisper-bin-ubuntu-x64/lib*.so* voice-overlay/src-tauri/binaries/
          chmod +x voice-overlay/src-tauri/binaries/ffmpeg-* voice-overlay/src-tauri/binaries/whisper-*

      - name: Vendor ffmpeg + whisper sidecars (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_WINDOWS_URL -OutFile C:\Windows\Temp\ffmpeg.zip
          Expand-Archive C:\Windows\Temp\ffmpeg.zip -DestinationPath C:\Windows\Temp\ffmpeg
          Copy-Item C:\Windows\Temp\ffmpeg\ffmpeg-*-essentials_build\bin\ffmpeg.exe voice-overlay\src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe
          Invoke-WebRequest -Uri $env:WHISPER_WINDOWS_URL -OutFile C:\Windows\Temp\whisper.zip
          Expand-Archive C:\Windows\Temp\whisper.zip -DestinationPath C:\Windows\Temp\whisper
          Copy-Item C:\Windows\Temp\whisper\Release\whisper-cli.exe voice-overlay\src-tauri\binaries\whisper-x86_64-pc-windows-msvc.exe
          Copy-Item C:\Windows\Temp\whisper\Release\*.dll voice-overlay\src-tauri\binaries\

      - name: Set platform bundle resources
        # tauri-build fails when ANY resources glob matches nothing, so Linux
        # (*.so) and Windows (*.dll) need different lists. The script defaults
        # to the current OS; CI passes the matrix platform explicitly.
        shell: bash
        run: node scripts/tauri-resources.mjs --platform ${{ matrix.platform }}

      - name: Build Tauri app
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # linuxdeploy scans whisper after Tauri moves it to usr/bin.
            # Its $ORIGIN no longer contains the vendored shared libraries.
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/voice-overlay/src-tauri/binaries${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          npm --prefix voice-overlay run build -- --verbose

      - name: Stage sidecar npm package
        shell: bash
        run: >
          node scripts/pack-voice-overlay.mjs
          --platform ${{ matrix.platform }}
          --version "$(node -p "require('./package.json').version")"
          --src voice-overlay/src-tauri/target/release

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-overlay-${{ matrix.platform }}
          path: voice-overlay/src-tauri/target/release/bundle

      - name: Upgrade npm for OIDC trusted publishing
        if: startsWith(github.ref, 'refs/tags/voice-overlay-v')
        run: npm install -g npm@latest

      - name: Publish sidecar package
        if: startsWith(github.ref, 'refs/tags/voice-overlay-v')
        run: npm publish --access public ./voice-overlay/packaging/${{ matrix.platform }}
