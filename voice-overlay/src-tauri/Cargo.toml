[package]
name = "voice-overlay"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time", "sync", "macros", "io-util", "fs"] }
tempfile = "3"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast", "clipboard"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"

[dev-dependencies]
# Compile/test the Linux protocol backend on Windows as well.
x11rb = { version = "0.13.2", features = ["xtest"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
