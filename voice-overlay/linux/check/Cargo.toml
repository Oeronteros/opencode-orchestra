[package]
name = "voice-linux-input-check"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = { version = "0.13.2", features = ["xtest"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast", "clipboard"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "io-util", "fs", "rt-multi-thread"] }
